version: 2
updates:
  # Only ecosystems actually present in the repository are listed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /tools/ci
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Major upgrades are reviewed manually.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
