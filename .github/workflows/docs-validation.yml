name: docs-validation

# Validates YAML, JSON, and internal Markdown links.
# The repository is currently specification-only; Rust CI will be added
# when the first real crate is added to the workspace.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -r tools/ci/requirements.txt

      - name: Validate YAML, JSON, and internal links
        run: python tools/ci/validate_docs.py
